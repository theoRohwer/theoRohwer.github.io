html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}

/* header = drawing title block */
.bar{display:flex;flex-wrap:wrap;align-items:stretch;gap:0 28px;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:12px;padding-block:10px}
.brand h1{margin:0;font:700 20px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.brand .back{font:600 12.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-decoration:none;border:1px solid var(--rule);border-radius:4px;padding:5px 8px;align-self:center}
.brand .back:hover{border-color:var(--accent)}
.brand .course{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;cursor:pointer;white-space:nowrap;
  font:600 13.5px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tab .n{font:500 11px/1 var(--f-mono);margin-right:7px;letter-spacing:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.chip:focus-visible,.act:focus-visible,.hudbtn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,410px);min-height:0}
.view{position:relative;min-height:0;background:var(--scene);overflow:hidden}
.view canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font:600 14px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;padding:3px 5px;border-radius:3px;
  background:color-mix(in srgb,var(--scene) 78%,transparent);transition:opacity .15s}
.lbl i{font-family:"Times New Roman",Georgia,serif;font-size:16px;font-weight:600}
.lbl.sm{font-size:12px;font-weight:500;color:var(--ink-2)}
.lbl.behind{opacity:.28}
.viewnote{position:absolute;top:12px;left:14px;right:14px;font:500 11.5px/1.4 var(--f-mono);color:var(--muted);pointer-events:none;letter-spacing:.02em}
.hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;pointer-events:none}
.hud .hint{font:500 12px/1.3 var(--f-body);color:var(--muted);margin-right:auto}
.hudbtn{pointer-events:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer;
  font:600 12px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.hudbtn:hover{color:var(--ink);border-color:var(--ink-2)}
.hudbtn[aria-pressed="false"]{opacity:.6}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* panel = the drawing sheet */
.panel{overflow-y:auto;background:var(--panel);border-left:1px solid var(--rule);padding-block:18px 36px;
  padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.sheet{display:flex;justify-content:space-between;gap:12px;font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--rule);padding:7px 9px}
.head h2{margin:0 0 6px;font:700 25px/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.head p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:62ch}
.sec h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font:600 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.ctls{display:flex;flex-direction:column;gap:12px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.ctl-l{font-size:14px;color:var(--ink);display:flex;align-items:baseline;gap:7px;min-width:0}
.sym{font:600 17px/1 "Times New Roman",Georgia,serif;font-style:italic;min-width:14px}
.num{display:flex;align-items:center;gap:4px}
.num input{width:84px;text-align:right;font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:5px 6px}
.num .unit{font:500 12px/1 var(--f-mono);color:var(--muted);min-width:18px}
.ctl input[type=range]{grid-column:1/-1;width:100%;margin:2px 0;accent-color:var(--accent)}
.ctl select{grid-column:2;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;font-size:14px;max-width:220px}
.band{grid-column:1/-1;position:relative;height:6px;background:var(--rule);border-radius:3px;margin-top:-2px}
.band i{position:absolute;top:0;bottom:0;background:var(--cov);border-radius:3px;opacity:.85}
.bandtxt{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{background:var(--ink);color:var(--panel);border:0;border-radius:4px;padding:7px 13px;cursor:pointer;font:600 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.act[aria-pressed="true"]{background:var(--accent)}
.actnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.legend li{display:grid;grid-template-columns:18px minmax(26px,max-content) minmax(0,1fr) auto;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--rule)}
.legend li:last-child{border-bottom:0}
.sw{height:3px;border-radius:2px}
.ls{font:600 17px/1 "Times New Roman",Georgia,serif;font-style:italic}
.ln{font-size:14px;color:var(--ink-2)}
.lv{font:500 13.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags:empty{display:none}
.flag{font-size:13px;padding:4px 10px;border-radius:4px;line-height:1.35}
.flag.ok{background:var(--ok-bg);color:var(--ok-fg)} .flag.warn{background:var(--warn-bg);color:var(--warn-fg)} .flag.info{background:var(--info-bg);color:var(--info-fg)}
.nums{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.nums div{min-width:0}
.nums dt{font-size:12.5px;color:var(--muted);line-height:1.25}
.nums dd{margin:2px 0 0;font:500 14.5px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.eqs{display:flex;flex-direction:column;gap:10px}
.eq{border-left:2px solid var(--rule);padding:2px 0 2px 10px;overflow-x:auto}
.eq-f{font:italic 15.5px/1.45 "Times New Roman",Georgia,serif;color:var(--ink)}
.eq-n{font:400 12.5px/1.5 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart text{font:500 10px var(--f-mono);fill:var(--muted)}
.note{margin:0;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.refs ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}

@media (max-width: 860px){
  html,body{height:auto}

  .hud .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .lbl{transition:none} }

function elOrbit(st){

  const Od=-k*Math.cos(I)*R2D*DAY, Wd=k*(2-2.5*Math.sin(I)**2)*R2D*DAY;
  return {rp,ra,a,e,p,I,O,W,NU,Q,n,Od,Wd};
}

const SITES={
  ksc:{name:'KSC',short:'KSC',lat:28.57,lon:-80.60,az:[35,120],A:90},

function laGeom(st){
  const d=st.lat*D2R, A=st.A*D2R, al=st.alpha*D2R;
  const s=v3(Math.cos(d)*Math.cos(al),Math.cos(d)*Math.sin(al),Math.sin(d));
  const E=v3(-Math.sin(al),Math.cos(al),0), N=v3(-Math.sin(d)*Math.cos(al),-Math.sin(d)*Math.sin(al),Math.cos(d));
  const dirFor=a=>N.clone().multiplyScalar(Math.cos(a)).addScaledVector(E,Math.sin(a));
  const dir=dirFor(A), h=s.clone().cross(dir).normalize();
  return {d,A,al,s,E,N,dir,h,dirFor};
}
function laCalc(st){
  const g=laGeom(st), cosi=Math.cos(g.d)*Math.sin(g.A), i=Math.acos(clamp(cosi,-1,1))*R2D;
  const nz=v3(-g.h.y,g.h.x,0), nodeOK=nz.length()>1e-6, n=nodeOK?nz.normalize():Xh();
  const Om=nodeOK?wrap360(Math.atan2(n.y,n.x)*R2D):NaN;
  const site=SITES[st.site]; let range=null, imin, imax, inRange=true;
  if(site.az){ range=site.az; imin=180; imax=0; for(let k=0;k<=400;k++){ const a=(range[0]+(range[1]-range[0])*k/400)*D2R; const ii=Math.acos(clamp(Math.cos(g.d)*Math.sin(a),-1,1))*R2D; imin=Math.min(imin,ii); imax=Math.max(imax,ii); } inRange=st.A>=range[0]-1e-9&&st.A<=range[1]+1e-9; }
  else { imin=Math.abs(st.lat); imax=180-Math.abs(st.lat); }
  const ti=Math.abs(i)<1e-9?Infinity:Math.tan(i*D2R);
  const sg=Math.tan(g.d)/ti, g2f=Math.abs(sg)<=1?Math.asin(sg)*R2D:NaN;
  const g2geo=nodeOK?wrap180(st.alpha-Om):NaN;
  const asc=Math.cos(g.A)>1e-9, vertex=Math.abs(Math.cos(g.A))<=1e-9;
  const dvRot=WE*RE*1000*Math.cos(g.d)*Math.sin(g.A);
  const v=Math.sqrt(MU/(RE+st.alt));
  const di=(st.itgt>=imin-1e-9&&st.itgt<=imax+1e-9)?0:Math.min(Math.abs(st.itgt-imin),Math.abs(st.itgt-imax));
  const diCur=Math.abs(st.itgt-i);
  return {g,cosi,i,nodeOK,n,Om,range,imin,imax,inRange,g2f,g2geo,asc,vertex,dvRot,v,di,dv:2*v*Math.sin(di*D2R/2),diCur,dvCur:2*v*Math.sin(diCur*D2R/2)};
}

function pcCalc(st){
  const H1=hvec(st.i1*D2R,st.O1*D2R), H2=hvec(st.i2*D2R,st.O2*D2R);

  const b=ok?cr.normalize():null;

  const n1raw=Zh().cross(H1), n1=n1raw.length()>1e-6?n1raw.normalize():Xh();
  const u1=ok?Math.atan2(H1.dot(n1.clone().cross(b)),n1.dot(b)):0;

  const rhs=Math.cos(st.i1*D2R)*Math.cos(da)-Math.sin(st.i1*D2R)*Math.sin(da)*Math.cos(u1);
  return {H1,H2,da,ok,b,r,v,dvH,dvE,n1,u1,cosda,rhs};
}

function cvCalc(st){
  const rho=Math.asin(RE/(RE+st.H)), eps=st.eps*D2R, eta=Math.asin(Math.sin(rho)*Math.cos(eps)), lam=Math.PI/2-eta-eps;

  const At=2*Math.PI*RE*RE*(1-Math.cos(lam)), F=0.5*(1-Math.cos(lam));
  return {rho,eps,eta,lam,lamSlide,lam0,D,At,F};
}

    const hz=S.clone().sub(T); hz.addScaledVector(T,-hz.dot(T)).normalize();
    line([T.clone().addScaledVector(hz,-0.35),T.clone().addScaledVector(hz,0.55)],'nu',{dashed:true,dash:0.03});
    arcBetween(T,hz,S.clone().sub(T),0.22,'nu','<i>ε</i>',{w:0.006,lr:1.5});
    const re=Math.min(0.75,0.18*(Rs-1)+0.18);
    arcBetween(S,s.clone().negate(),T.clone().sub(S),re,'phi','<i>η</i>',{w:w,lr:1.3});
    arcBetween(S,s.clone().negate(),Hp.clone().sub(S),re*1.55,'u','<i>ρ</i>',{w:w,lr:1.2});
    arcBetween(O0(),s,T,0.42,'inc','<i>λ</i>',{w:0.007,lr:1.35});
  },
  fit(st){ const {s,k}=cvGeom(); const Rs=1+st.H/RE; const C=cvCalc(st); const mid=s.clone().applyAxisAngle(k,C.lam*0.5).multiplyScalar(0.5*(Rs+1)*0.6); return {d:eci2w(k.clone().negate().add(s.clone().multiplyScalar(0.25)).normalize()),r:Math.max(3.4,1.9*Rs+1.6),t:eci2w(mid),eci:false}; },
  info(st){
    const C=cvCalc(st);
    return {
      legend:[{sym:'ε',name:'Elevation angle at target',val:dg(st.eps,2),tok:'nu'},{sym:'η',name:'Nadir angle at satellite',val:dg(C.eta*R2D,2),tok:'phi'},
        {sym:'λ',name:'Earth central angle',val:dg(C.lam*R2D,2),tok:'inc'},{sym:'ρ',name:'Angular radius of Earth',val:dg(C.rho*R2D,2),tok:'u'}],
      flags:[['ok',`Check: ε + η + λ = ${fmt(st.eps+C.eta*R2D+C.lam*R2D,2)}°`]],
      nums:[['Max central angle λ₀ (ε = 0)',dg(C.lam0*R2D,2)],['Swath width 2λ',`${fmt(2*C.lam*R2D,2)}° · ${fmt(2*C.lam*RE,0)} km`],['Slant range D',fmt(C.D,0)+' km'],['Coverage area A_t',fmt(C.At/1e6,2)+' million km²'],
        ['Fraction of Earth F',fmt(100*C.F,2)+' %'],['λ from slide formula',dg(C.lamSlide*R2D,2)]],
      eqs:[[`sin ρ = R${sub('E')} / (R${sub('E')} + H)`,`= 6371 / ${fmt(RE+st.H,0)} → ρ = ${fmt(C.rho*R2D,3)}°`],
        [`sin η = sin ρ · cos ε`,`→ η = ${fmt(C.eta*R2D,3)}°`],
        [`λ = 90° − η − ε  =  cos⁻¹( cos ε / (1 + H/R${sub('E')}) ) − ε`,`= ${fmt(C.lam*R2D,3)}° (slide form gives ${fmt(C.lamSlide*R2D,3)}°)`],
        [`A${sub('t')} = 2π R${sub('E')}² (1 − cos λ),  F = ½ (1 − cos λ)`,`A_t = ${fmt(C.At,0)} km² · F = ${fmt(C.F,4)}`]],
    };
  },
  note:'ρ and λ₀ describe the horizon. At ε = 0, the line of sight just grazes Earth, so η = ρ and λ = λ₀ = 90° − ρ. Raising the minimum elevation shrinks the usable circle quickly.',
  refs:['Astro Pt 2 Slides, slide 12: angular relationships (ε, η, λ)','Astro Pt 2 Slides, slide 13: instantaneous coverage formulas','Astro Pt 2 Slides, slides 14–16: GEO, LEO and MEO coverage examples']
};

/* ---------- Mode 5: Phase angle ---------- */
const DEST={mars:{name:'Mars',r:228e6},venus:{name:'Venus',r:108.2e6},jupiter:{name:'Jupiter',r:778.5e6}};
function phCalc(st){
  const r1=149e6, r2=DEST[st.dest].r, at=(r1+r2)/2, e=Math.abs(r2-r1)/(r1+r2), p=at*(1-e*e);
  const tx=Math.PI*Math.sqrt(at**3/MUS), T1=2*Math.PI*Math.sqrt(r1**3/MUS), T2=2*Math.PI*Math.sqrt(r2**3/MUS);
  const n1=2*Math.PI/T1, n2=2*Math.PI/T2, th2=n2*tx, phi=Math.PI-th2, Ts=T1*T2/Math.abs(T2-T1), out=r2>r1;
  const V1=Math.sqrt(MUS/r1), V2=Math.sqrt(MUS/r2), Vd=Math.sqrt(MUS*(2/r1-1/at)), Va=Math.sqrt(MUS*(2/r2-1/at));
  return {r1,r2,at,e,p,tx,T1,T2,n1,n2,th2,phi,Ts,out,varpi:out?0:Math.PI,M0:out?0:Math.PI,vinfD:Math.abs(Vd-V1),vinfA:Math.abs(V2-Va)};
}
function phSc(P,t){ const Mm=P.M0+Math.PI*t/P.tx, E=keplerE(Mm,P.e), nu=2*Math.atan2(Math.sqrt(1+P.e)*Math.sin(E/2),Math.sqrt(1-P.e)*Math.cos(E/2)); return {r:P.at*(1-P.e*Math.cos(E)),ang:P.varpi+nu}; }
const PHASE={
  id:'ph',hash:'phase',tab:'Phase angle',title:'Departure phase angle',
  lede:'For a Hohmann transfer the spacecraft sweeps θ_xfer = 180°. During that time the destination moves θ₂. So at launch, the destination must already lead Earth by φ = θ_xfer − θ₂. Scrub the time slider to watch them meet.',
  viewnote:()=>'Heliocentric · circular, coplanar orbits · Earth–Sun 149 × 10⁶ km, Mars–Sun 228 × 10⁶ km',
  init:{dest:'mars',t:0},
  controls:[
    {k:'dest',type:'select',label:'Destination',options:Object.entries(DEST).map(([k,d])=>[k,d.name])},
    {k:'t',label:'Time since departure',min:0,max:100,step:0.1,unit:'%'}],
  actions:[{id:'xfer',label:'Fly transfer'}],
  actnote:'Runs the transfer from departure to arrival in 8 s.',
  refitOn:['dest'],
  build(st){
    const P=phCalc(st), k=1e-8, r1=P.r1*k, r2=P.r2*k, sz=Math.max(r1,r2)/2.28, w=0.008*sz;
    disc(1.12*Math.max(r1,r2),'eqplane',0.06);
    dot(O0(),'sun',0.09*Math.max(1,sz*0.7)); label('Sun',v3(0,0,0.2*sz),'sun','sm');
    ring(Zh(),r1,'orbit',{w:w*0.7,opacity:0.6}); ring(Zh(),r2,'orbit2',{w:w*0.7,opacity:0.6});
    const half=[], rest=[];
    for(let j=0;j<=120;j++){ const nu=(P.out?0:Math.PI)+Math.PI*j/120, r=P.p/(1+P.e*Math.cos(nu))*k, a=P.varpi+nu; half.push(v3(r*Math.cos(a),r*Math.sin(a),0)); }
    for(let j=0;j<=120;j++){ const nu=(P.out?Math.PI:0)+Math.PI*j/120, r=P.p/(1+P.e*Math.cos(nu))*k, a=P.varpi+nu; rest.push(v3(r*Math.cos(a),r*Math.sin(a),0)); }
    tube(half,'dv',w); line(rest,'dv',{dashed:true,dash:0.08*sz,opacity:0.45});
    const t=st.t/100*P.tx, pol=(r,a)=>v3(r*Math.cos(a),r*Math.sin(a),0);
    const eDep=pol(r1,0), dDep=pol(r2,P.phi), arr=pol(r2,Math.PI);
    line([O0(),eDep],'orbit',{opacity:0.4}); line([O0(),dDep],'orbit2',{opacity:0.4}); line([O0(),arr],'ink-2',{dashed:true,dash:0.05*sz,opacity:0.5});
    dot(eDep,'orbit',w*3.2,{opacity:0.35}); dot(dDep,'orbit2',w*3.2,{opacity:0.35}); dot(arr,'dv',w*2.6,{opacity:0.6});
    label('arrival',arr.clone().multiplyScalar(1.1),'dv','sm');
    const eNow=pol(r1,P.n1*t), dNow=pol(r2,P.phi+P.n2*t), s=phSc(P,t), sNow=pol(s.r*k,s.ang);
    dot(eNow,'orbit',w*4.5); label('Earth',eNow.clone().multiplyScalar(1.1).add(v3(0,0,0.12*sz)),'orbit','sm');
    dot(dNow,'orbit2',w*4.5); label(DEST[st.dest].name,dNow.clone().multiplyScalar(1.08).add(v3(0,0,0.12*sz)),'orbit2','sm');
    if(st.t>0.05&&st.t<99.95){ dot(sNow,'dv',w*3.6); label('s/c',sNow.clone().multiplyScalar(0.92).add(v3(0,0,0.1*sz)),'dv','sm'); }
    const rm=Math.min(r1,r2);
    angArc(O0(),Xh(),Zh(),Math.PI,rm*0.3,'nu','<i>θ</i><sub>xfer</sub>',{w:w,lr:1.35});
    angArc(O0(),Xh(),Zh(),P.phi,r1*0.55,'inc','<i>φ</i>',{w:w*1.2,lr:1.2});
    angArc(O0(),pol(1,P.phi),Zh(),P.th2,(P.out?0.82*r2:0.82*r2),'argp','<i>θ</i>₂',{w:w*1.2,lr:1.12});
  },
  fit(st){ const P=phCalc(st); return {d:v3(0.15,1,0.75),r:2.9*Math.max(P.r1,P.r2)*1e-8+1}; },
  tick(dt,st,mode){ if(mode!=='xfer') return []; st.t=Math.min(100,st.t+dt*100/8); if(st.t>=100) stopPlay(); return ['t']; },
  info(st){
    const P=phCalc(st), t=st.t/100*P.tx/DAY;
    return {
      legend:[{sym:'φ',name:'Phase angle at departure',val:dg(P.phi*R2D,2),tok:'inc'},{sym:'θ<sub>xfer</sub>',name:'Transfer sweep angle',val:'180.00°',tok:'nu'},{sym:'θ₂',name:'Destination travel during transfer',val:dg(P.th2*R2D,2),tok:'argp'}],
      flags:[[P.phi>=0?'info':'info',P.phi>=0?`${DEST[st.dest].name} must lead Earth by ${fmt(P.phi*R2D,1)}° at launch.`:`${DEST[st.dest].name} must trail Earth by ${fmt(-P.phi*R2D,1)}° at launch (inner planet).`]],
      nums:[['Transfer a',fmt(P.at/1e6,1)+' ×10⁶ km'],['Transfer time',fmt(P.tx/DAY,1)+' days'],['Earth period T₁',fmt(P.T1/DAY,1)+' days'],[DEST[st.dest].name+' period T₂',fmt(P.T2/DAY,1)+' days'],
        ['Synodic period',`${fmt(P.Ts/DAY,0)} days · ${fmt(P.Ts/DAY/365.25,2)} yr`],['Elapsed',fmt(t,1)+' days'],['V∞ at departure',fmt(P.vinfD,3)+' km/s'],['C₃ = V∞²',fmt(P.vinfD**2,2)+' km²/s²'],['V∞ at arrival',fmt(P.vinfA,3)+' km/s']],
      eqs:[[`t${sub('xfer')} = π √( a${sub('t')}³ / μ${sub('☉')} ),  a${sub('t')} = (r${sub(1)} + r${sub(2)}) / 2`,`= ${fmt(P.tx/DAY,2)} days`],
        [`θ${sub(2)} = (t${sub('xfer')} / T${sub(2)}) · 360°`,`= (${fmt(P.tx/DAY,1)} / ${fmt(P.T2/DAY,1)}) · 360° = ${fmt(P.th2*R2D,2)}°`],
        [`φ = θ${sub('xfer')} − θ${sub(2)}`,`= 180° − ${fmt(P.th2*R2D,2)}° = ${fmt(P.phi*R2D,2)}°`],
        [`T${sub('s')} = T${sub(1)} T${sub(2)} / (T${sub(2)} − T${sub(1)})`,`= ${fmt(P.Ts/DAY,1)} days between launch windows`],
        [`V∞ = | √( μ${sub('☉')} (2/r${sub(1)} − 1/a${sub('t')}) ) − √( μ${sub('☉')} / r${sub(1)} ) |`,`= ${fmt(P.vinfD,4)} km/s,  C₃ = ${fmt(P.vinfD**2,3)} km²/s²`]],
    };
  },
  note:'μ☉ = 1.327 × 10¹¹ km³/s², r⊕ = 149 × 10⁶ km and r♂ = 228 × 10⁶ km. Venus and Jupiter use mean orbit radii.',
  refs:['Interplanetary Slides, slide 14: phase angle at departure and synodic period','Astro Notes p.12: hyperbolic excess speed and C₃']
};

const MODES=[ELEMENTS,LAUNCH,PLANE,COVERAGE,PHASE];
const S={}; MODES.forEach(m=>{ S[m.id]=Object.assign({},m.init); });
let cur=MODES[0], play=null, occR=1;

/* ---------- UI ---------- */
const tabs=$('#tabs');
tabs.innerHTML=MODES.map((m,i)=>`<button class="tab" role="tab" id="tab-${m.id}" aria-selected="false" data-mode="${m.id}"><span class="n">0${i+1}</span>${m.tab}</button>`).join('');
tabs.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) setMode(b.dataset.mode); });

function ctlHTML(m,c){
  const id=`${m.id}-${c.k}`;
  const symH=c.sym?`<span class="sym" style="color:var(--${c.tok||'ink'})">${c.sym}</span>`:'';
  if(c.type==='select') return `<div class="ctl"><label class="ctl-l" for="s-${id}">${c.label}</label><select id="s-${id}">${c.options.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`;
  return `<div class="ctl"><label class="ctl-l" for="r-${id}">${symH}<span>${c.label}</span></label>
    <span class="num"><input type="number" id="n-${id}" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label} value"><span class="unit">${c.unit}</span></span>
    <input type="range" id="r-${id}" min="${c.min}" max="${c.max}" step="${c.step}">
    ${c.band?`<div class="band" id="band-${id}"><i></i></div><div class="bandtxt" id="bandtxt-${id}"></div>`:''}</div>`;
}
function syncCtl(m,k){
  const id=`${m.id}-${k}`, v=S[m.id][k];
  const sel=document.getElementById('s-'+id); if(sel){ sel.value=v; return; }
  const r=document.getElementById('r-'+id), n=document.getElementById('n-'+id);
  if(r) r.value=v; if(n&&document.activeElement!==n){ const c=m.controls.find(c=>c.k===k); const dec=(String(c.step).split('.')[1]||'').length; n.value=(+v).toFixed(dec); }
}
function renderPanel(){
  const m=cur, idx=MODES.indexOf(m)+1;
  panel.innerHTML=`
    <div class="sheet"><span>Sheet 0${idx} of 05</span><span>${m.tab}</span></div>
    <div class="head"><h2>${m.title}</h2><p>${m.lede}</p></div>
    ${m.presets?`<div class="sec"><h3>Examples</h3><div class="chips">${m.presets.map((p,i)=>`<button class="chip" data-preset="${i}">${p.name}</button>`).join('')}</div></div>`:''}
    <div class="sec"><h3>Inputs</h3><div class="ctls">${m.controls.map(c=>ctlHTML(m,c)).join('')}</div>
      ${m.actions?`<div class="acts">${m.actions.map(a=>`<button class="act" data-act="${a.id}" aria-pressed="false">${a.label}</button>`).join('')}</div><div class="actnote">${m.actnote||''}</div>`:''}</div>
    <div class="sec"><h3>Angles in view</h3><ul class="legend" id="legend"></ul></div>
    <div class="flags" id="flags"></div>
    <div class="sec"><h3>Numbers</h3><dl class="nums" id="nums"></dl></div>
    ${m.chart?`<div class="sec"><h3>${m.chartTitle}</h3><div class="chart" id="chart"></div></div>`:''}
    <div class="sec"><h3>Course equations, live</h3><div class="eqs" id="eqs"></div></div>
    ${m.note?`<p class="note">${m.note}</p>`:''}
    <div class="sec refs"><h3>Where this is in your notes</h3><ul>${m.refs.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
  m.controls.forEach(c=>{
    const id=`${m.id}-${c.k}`;
    syncCtl(m,c.k);
    if(c.type==='select'){ document.getElementById('s-'+id).addEventListener('change',e=>{ S[m.id][c.k]=e.target.value; changed(c.k); }); return; }
    const r=document.getElementById('r-'+id), n=document.getElementById('n-'+id);
    r.addEventListener('input',()=>{ S[m.id][c.k]=parseFloat(r.value); syncCtl(m,c.k); changed(c.k); });
    n.addEventListener('change',()=>{ let v=parseFloat(n.value); if(!Number.isFinite(v)) v=S[m.id][c.k]; v=clamp(v,c.min,c.max); S[m.id][c.k]=v; r.value=v; n.value=v; changed(c.k); });
  });
  panel.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{ stopPlay(); Object.assign(S[m.id],m.presets[+b.dataset.preset].v); m.controls.forEach(c=>syncCtl(m,c.k)); rebuild(); updatePanel(); fit(); }));
  panel.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.act; if(play===id) stopPlay(); else startPlay(id); }));
}
function updatePanel(){
  const m=cur, st=S[m.id], inf=m.info(st);
  $('#legend').innerHTML=inf.legend.map(l=>`<li><span class="sw" style="background:var(--${l.tok})"></span><span class="ls" style="color:var(--${l.tok})">${l.sym}</span><span class="ln">${l.name}</span><span class="lv">${l.val}</span></li>`).join('');
  $('#flags').innerHTML=(inf.flags||[]).map(f=>`<span class="flag ${f[0]}">${f[1]}</span>`).join('');
  $('#nums').innerHTML=inf.nums.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  $('#eqs').innerHTML=inf.eqs.map(e=>`<div class="eq"><div class="eq-f">${e[0]}</div><div class="eq-n">${e[1]}</div></div>`).join('');
  if(m.chart) $('#chart').innerHTML=m.chart(st,inf);
  if(m.band){ const c=m.controls.find(c=>c.band), id=`${m.id}-${c.k}`, b=m.band(st), seg=document.querySelector(`#band-${id} i`);
    if(b.r){ seg.style.left=((b.r[0]-c.min)/(c.max-c.min)*100)+'%'; seg.style.width=((b.r[1]-b.r[0])/(c.max-c.min)*100)+'%'; } else { seg.style.left='0'; seg.style.width='100%'; }
    document.getElementById('bandtxt-'+id).textContent=b.txt; }
}
function changed(k){
  const m=cur, st=S[m.id];
  if(m.onChange){ m.onChange(k,st); m.controls.forEach(c=>syncCtl(m,c.k)); }
  rebuild(); updatePanel();
  if(m.refitOn&&m.refitOn.includes(k)) fit();
  else if(m.zoomOn&&m.zoomOn.includes(k)&&controls){ const f=m.fit(st), asp=camera.aspect||1, kk=asp<1.25?Math.min(1.9,1.25/asp):1; const d=camera.position.clone().sub(controls.target).normalize(); camera.position.copy(controls.target).addScaledVector(d,f.r*kk); controls.update(); }
}
function rebuild(){ spin.rotation.z=cur.spin?cur.spin(S[cur.id])*D2R:0; clearG(); cur.build(S[cur.id]); }
function fit(){
  if(!controls) return;
  const f=cur.fit(S[cur.id]); const t=f.t||v3(0,0,0);
  const asp=camera.aspect||1, k=asp<1.25?Math.min(1.9,1.25/asp):1;
  camera.position.copy(t).add(f.d.clone().normalize().multiplyScalar(f.r*k)); controls.target.copy(t); camera.up.set(0,1,0); controls.update();
}
function startPlay(id){ play=id; panel.querySelectorAll('[data-act]').forEach(b=>{ const on=b.dataset.act===id; b.setAttribute('aria-pressed',on); b.textContent=on?'Pause':cur.actions.find(a=>a.id===b.dataset.act).label; });
  if(id==='xfer'&&S.ph.t>=100){ S.ph.t=0; } }
function stopPlay(){ play=null; panel.querySelectorAll('[data-act]').forEach(b=>{ b.setAttribute('aria-pressed','false'); b.textContent=cur.actions.find(a=>a.id===b.dataset.act).label; }); }
function setMode(id){
  stopPlay(); cur=MODES.find(m=>m.id===id)||MODES[0];
  tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mode===cur.id));
  earthGroup.visible=cur.id!=='ph'; earthMat.opacity=cur.id==='cv'?0.5:0.94; earthMat.depthWrite=cur.id!=='cv';
  occR=(cur.id==='cv'||cur.id==='ph')?0:1;
  $('#viewnote').textContent=cur.viewnote();
  renderPanel(); rebuild(); updatePanel(); fit();
}
$('#btn-fit').addEventListener('click',fit);
$('#btn-labels').addEventListener('click',e=>{ const on=layer.hidden; layer.hidden=!on; e.currentTarget.setAttribute('aria-pressed',on); });

/* ---------- theme ---------- */
function applyTheme(){ for(const m of mats.values()) m.color.set(tok(m.userData.token)); paintLand(); scene.background=new THREE.Color(tok('scene')); if(cur.chart) updatePanel(); }
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- loop ---------- */
function resize(){ if(!renderer) return; const w=view.clientWidth, h=view.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
const tmp=new THREE.Vector3();
function placeLabels(){
  if(layer.hidden) return;
  const w=view.clientWidth, h=view.clientHeight, cam=camera.position;
  for(const L of labels){
    tmp.copy(L.p); root.localToWorld(tmp); const world=tmp.clone(); tmp.project(camera);
    if(tmp.z>1||tmp.z<-1||!Number.isFinite(tmp.x)){ L.el.style.visibility='hidden'; continue; }
    L.el.style.visibility='visible';
    L.el.style.transform=`translate(${((tmp.x*0.5+0.5)*w).toFixed(1)}px,${((-tmp.y*0.5+0.5)*h).toFixed(1)}px) translate(-50%,-50%)`;
    let behind=false;
    if(occR>0){ if(world.length()<occR*0.999) behind=true; else { const d=world.clone().sub(cam), Ld=d.length(); d.divideScalar(Ld); const t=-cam.dot(d); if(t>0&&t<Ld){ const cl=cam.clone().addScaledVector(d,t); if(cl.length()<occR*0.985) behind=true; } } }
    L.el.classList.toggle('behind',behind);
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(play&&cur.tick){ const ks=cur.tick(dt,S[cur.id],play); if(ks.length){ ks.forEach(k=>syncCtl(cur,k)); rebuild(); updatePanel(); } }
  if(controls) controls.update();
  if(renderer){ renderer.render(scene,camera); placeLabels(); }
  requestAnimationFrame(frame);
}
const startHash=(location.hash||'').slice(1); const hm=MODES.find(m=>m.hash===startHash);
scene.background=new THREE.Color(tok('scene'));
setMode(hm?hm.id:'el'); resize(); fit();
requestAnimationFrame(frame);
})();
</script>

</body></html>
